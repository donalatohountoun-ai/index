<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte de Profil</title>
  <!-- On relie le CSS séparé -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- article = carte indépendante (sémantique) -->
  <article class="profile-card">
    
    <!-- photo circulaire -->
    <img 
      src="c:\Users\USER\Pictures\1789310907986.jpg" 
      alt="Photo de profil"
      class="profile-img"
    >
    <!-- h2 = nom important -->
    <h2>Donal ATOHOUNTOUN</h2>
    <!-- role = métier / statut -->
    <p class="role">Dev Web & Mobile</p>
    <!-- bio = petite description -->
    <p class="bio">
    Jeune Dev Web et Mobile, passionné par le code et le design.
    </p>
    <!-- button = action -->
    <button type="button">Contacter</button>
  </article>
</body>
</html>
